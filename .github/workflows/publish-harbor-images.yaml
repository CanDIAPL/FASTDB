name: Publish FASTDB Images to Harbor

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag applied to all five FASTDB images
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and push FASTDB images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKER_ARCHIVE: images.canfar.net/candiapl
      DOCKER_VERSION: ${{ inputs.image_tag }}

    steps:
      - name: Check out FASTDB
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: images.canfar.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build FASTDB images
        run: |
          docker compose build \
            postgres \
            mongodb \
            shell \
            webap \
            queryrunner

      - name: Push FASTDB images
        run: |
          docker compose push \
            postgres \
            mongodb \
            shell \
            webap \
            queryrunner
