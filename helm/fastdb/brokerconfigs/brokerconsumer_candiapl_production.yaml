brokers:
  fink:
    class: FinkConsumer
    server: kafka-lsst.fink-broker.org:24499
    groupid: fastdb-{barf} # N.B. prepend with your fink registered groupd id
    topics : [
      'fink_extragalactic_lt20mag_candidate_lsst',
      'fink_extragalactic_new_candidate_lsst',
      'fink_extragalactic_svom_lsst',
      'fink_faint_trails_lsst',
      'fink_fast_transient_gvom_lsst',
      'fink_hostless_candidate_lsst',
      'fink_in_simbad_lsst',
      'fink_in_tns_lsst',
      'fink_is_solar_system_lsst',
      'fink_mdwarf_flare_lsst',
      'fink_most_likely_sn_lsst',
      'fink_remove_unlikely_transients_lsst',
      'fink_sn_near_galaxy_candidate_lsst',
      'fink_uniform_sample_lsst'
    ]
    schemaless: False
    schema_in_key: True
    updatetopics: false
    brokername_for_alerts: "LaunchedFink"
    mongodb_collection_base: fastdb_fink_test
    cache_alerts: true
    loggername: FINK
    loggername_prefix: ""
    batch_size: 10
    consume_timeout: 1
    nomsg_sleeptime: 1
    batch_size: 10
    extraconfig: null
    extraconfigjson: null
    pollkwargs:
      restart_time_min: 0.1666667
      notopic_sleeptime: 2
      max_restarts: null
