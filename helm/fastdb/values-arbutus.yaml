# FASTDB development deployment on a single-node Arbutus K3s VM.
# This example uses prebuilt images from the CanDIAPL registry namespace.

global:
  namespace: fastdb-arbutus
  environment: dev
  imageRegistry: images.canfar.net/candiapl
  imageTag: manual-20260918
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
    # - name: fastdb-registry

volumes:
  type: pvc
  storageClass: local-path # This uses the k3s local path provisioner and is not part of k8s
  codeHostPath: true

postgres:
  enabled: true
  persistence:
    size: 8Gi
    accessMode: ReadWriteOnce
  externalAccess:
    enabled: false

# A standby on the same VM would consume resources without protecting against
# failure of that VM.
postgresStandby:
  enabled: false

mongodb:
  enabled: true
  persistence:
    size: 8Gi
    accessMode: ReadWriteOnce

webap:
  enabled: true
  externalAccess:
    enabled: true
    type: NodePort
    nodePort: 30080
  volumes:
    sessions:
      size: 1Gi
      accessMode: ReadWriteOnce
    queryResults:
      size: 1Gi
      accessMode: ReadWriteOnce
    logs:
      size: 1Gi
      accessMode: ReadWriteOnce

shell:
  enabled: true

queryrunner:
  enabled: true

mailhog:
  enabled: true
  externalAccess:
    enabled: true
    type: NodePort
    nodePort: 30025

createdb:
  enabled: true

ingestion:
  enabled: true
  brokerConsumer:
    replicas: 1
    config: "brokerconfigs/brokerconsumer_candiapl_staging.yaml"
    # LASS advertises localhost:19092. This proxy forwards that pod-local
    # address to the Docker-published Kafka port on the VM.
    dockerHostIp: ""
    localhostProxy: true
  processingVersion:
    name: staging
  sourceImporter:
    schedule: "* * * * *"
    collections: # Collection base names to import
      - "fastdb_fink_test"
      - "fastdb_lass_test"
